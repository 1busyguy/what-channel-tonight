name: Build and deploy site

on:
  schedule:
    - cron: "0 10 * * *"   # ~6 AM ET: morning refresh with today's games
    - cron: "0 21 * * *"   # ~5 PM ET: pre-game refresh (late TV changes)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Last-good ESPN data from previous runs (used if the API fails).
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: espn-data-${{ github.run_id }}
          restore-keys: espn-data-

      # Build. If it fails validation, the job stops here and the live site stays as it was.
      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: |
          if [ -z "$SITE_URL" ]; then unset SITE_URL; fi
          if [ -z "$GOATCOUNTER_CODE" ]; then unset GOATCOUNTER_CODE; fi
          python build.py

      - name: Publish dist/ to gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
