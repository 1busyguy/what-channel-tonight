<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
{% if CFG.GOATCOUNTER_CODE %}
<meta http-equiv="refresh" content="3;url={{ svc.url }}">
<script>
  // Register the affiliate click as a GoatCounter event "go/{{ key }}", then redirect.
  window.goatcounter = {no_onload: true};
  var dest = {{ svc.url|tojson }}, done = false;
  function go(){ if (!done) { done = true; location.replace(dest); } }
  function track(){
    try { window.goatcounter.count({path: "go/{{ key }}", title: "Affiliate click: {{ svc.name }}", event: true}); } catch (e) {}
    setTimeout(go, 200);
  }
  setTimeout(go, 1500); // never strand the visitor if the counter is blocked
</script>
<script data-goatcounter="https://{{ CFG.GOATCOUNTER_CODE }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js" onload="track()" onerror="go()"></script>
<noscript><img src="https://{{ CFG.GOATCOUNTER_CODE }}.goatcounter.com/count?p=go/{{ key }}&amp;e=true" alt="" width="1" height="1"></noscript>
{% else %}
<meta http-equiv="refresh" content="0;url={{ svc.url }}">
<script>location.replace({{ svc.url|tojson }});</script>
{% endif %}
<link rel="canonical" href="{{ svc.url }}">
</head><body style="font-family:system-ui,sans-serif;padding:2rem">
<p>Taking you to <a href="{{ svc.url }}" rel="sponsored nofollow">{{ svc.name }}</a>…</p>
<p style="color:#666;font-size:.9rem">{{ CFG.SITE_NAME }} may earn a commission if you sign up. It costs you nothing extra.</p>
</body></html>
