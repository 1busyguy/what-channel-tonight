# Extra notes on specific team pages (key = league/team-slug). Keep these factual and evergreen.
teams:
  nfl/buffalo-bills:
    note: "On Spectrum, DIRECTV or any cable box, Sunday afternoon Bills games are on your local CBS or FOX station, whichever network the game is listed on below. Primetime games are on NBC (Sunday night), ESPN/ABC (Monday night) or Prime Video (Thursday night). Prime Video games also air on a local broadcast station in the Bills' home market, so Spectrum and DIRECTV customers there can watch on regular TV."
  nfl/chicago-bears:
    note: "In the Chicago area, Sunday afternoon Bears games are on the local CBS or FOX station listed below. Primetime Bears games are national: NBC/Peacock on Sunday night, ESPN/ABC on Monday night, and Prime Video on Thursday night (also simulcast on a Chicago broadcast station)."
  nfl/new-england-patriots:
    note: "In New England, Sunday afternoon Patriots games air on the local CBS or FOX station listed below. Thursday games on Prime Video are also simulcast on a Boston-market broadcast station; elsewhere they are Prime Video only."
  nba/cleveland-cavaliers:
    note: "Not sure why the Cavs aren't on your usual channel? Local Cavaliers broadcasts are listed below exactly as the league schedule shows them for each game. If a game lists a streaming app as the local outlet, that stream only works inside the Cavaliers' home territory. Nationally televised games are on ESPN/ABC, NBC/Peacock or Prime Video for everyone."
  nba/philadelphia-76ers:
    note: "Local Sixers games air in the Philadelphia region on the regional network listed below. National 76ers games are on ESPN/ABC, NBC/Peacock or Prime Video."
  nba/oklahoma-city-thunder:
    note: "Local Thunder games air in Oklahoma on the local broadcaster and team app listed below. National Thunder games are on ESPN/ABC, NBC/Peacock or Prime Video, and those are available everywhere."
  nhl/boston-bruins:
    note: "Local Bruins games are on NESN in New England. Out of market, most Bruins games stream on ESPN+. National games air on ESPN/ABC or TNT."
  nhl/nashville-predators:
    note: "Local Predators broadcasts are listed below for each game; some air free over the air on Scripps Sports stations. Outside the Predators' market, most games stream on ESPN+."
